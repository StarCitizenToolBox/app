name: "Windows Nightly Build"
on:
    schedule:
        - cron: "0 0 * * *" # every day at midnight
    workflow_dispatch:    
jobs:
    build:
        runs-on: windows-latest
        env:
            CARGOKIT_CARGO_PROFILE: dist
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up MSbuild
              uses: microsoft/setup-msbuild@v2  

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                channel: 'stable'
                cache: true
                cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:' # optional, change this to force refresh cache
                cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:' # optional, change this to specify the cache path

            - run: flutter --version    

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Rust Version  
              run: |
                    rustup --version  
                    cargo --version
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                workspaces: "rust"
                cache-all-crates: true

            - name: Set up LLVM
              uses: KyleMayes/install-llvm-action@v2
              with:
               version: "18"
            - name: Set up NASM
              uses: ilammy/setup-nasm@v1
            - name: Flutter pub get
              run: flutter pub get  
            - name: Flutter build runner
              run: dart run build_runner build --delete-conflicting-outputs  
            - name: Rust cargo update
              run: cargo update  
              working-directory: rust

            - name: Set up Flutter rust bridge
              run: |
                    cargo install cargo-expand 
                    cargo install --locked flutter_rust_bridge_codegen --version 2.13.0

            - name: Flutter Rust bridge generate
              run: flutter_rust_bridge_codegen generate
            - name: flutter gen l10n
              run: | 
                    flutter pub global activate intl_utils
                    flutter pub global run intl_utils:generate
            # windows/CMakeLists.txt bundles msvcp140_app.dll and the
            # vcruntime*_app.dll it imports. They come from the
            # Microsoft.VCLibs.140.00 framework package, which the runner does
            # not have installed; take them from the x64 framework appx in the
            # VS UWP extension SDK instead.
            - name: Provide VCLibs app runtime
              shell: pwsh
              run: |
                $sdk = Join-Path ${env:ProgramFiles(x86)} "Microsoft SDKs/Windows Kits/10/ExtensionSDKs/Microsoft.VCLibs/14.0/Appx/Retail/x64"
                $appx = Get-ChildItem $sdk -Filter "Microsoft.VCLibs.x64.14.00.appx" -ErrorAction SilentlyContinue | Select-Object -First 1
                if (-not $appx) { throw "Microsoft.VCLibs x64 framework appx not found under $sdk" }
                $dir = Join-Path $env:RUNNER_TEMP "vclibs"
                New-Item -ItemType Directory -Force $dir | Out-Null
                Add-Type -AssemblyName System.IO.Compression.FileSystem
                $zip = [System.IO.Compression.ZipFile]::OpenRead($appx.FullName)
                try {
                  foreach ($name in "msvcp140_app.dll", "vcruntime140_app.dll", "vcruntime140_1_app.dll") {
                    $entry = $zip.Entries | Where-Object Name -eq $name | Select-Object -First 1
                    if (-not $entry) { throw "$name not found in $($appx.FullName)" }
                    [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $dir $name), $true)
                  }
                } finally {
                  $zip.Dispose()
                }
                Get-ChildItem $dir | ForEach-Object { "{0} {1}" -f $_.Name, $_.VersionInfo.FileVersion }
                "SCTOOLBOX_VCLIBS_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            - name: Flutter build Windows
              run: flutter build windows -v

            - name: Check bundled runtime DLLs
              shell: pwsh
              run: |
                $missing = @(
                  "msvcp140.dll", "msvcp140_1.dll", "vcruntime140.dll", "vcruntime140_1.dll",
                  "msvcp140_app.dll", "vcruntime140_app.dll", "vcruntime140_1_app.dll", "DirectML.dll"
                ) | Where-Object { -not (Test-Path (Join-Path "build/windows/x64/runner/Release" $_)) }
                if ($missing) { throw "Missing from the Release bundle: $($missing -join ', ')" }

            - name: Archive build
              uses: actions/upload-artifact@v7
              with:
                name: windows
                path: build/windows/x64/runner/Release
